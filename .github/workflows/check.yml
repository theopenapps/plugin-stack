name: Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: No AI attribution in commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ github.event.pull_request.commits_url }}
        run: "! gh api --paginate \"$COMMITS\" --jq '.[].commit.message' | grep -iE '^(co-authored-by: .*(claude|anthropic)|claude-session:)'"
      - run: npm ci
      - run: npx tsc
      - run: node scripts/check-skills.ts
      - run: node scripts/check-contract.ts
      - run: npm install -g @anthropic-ai/claude-code @openai/codex
      - run: scripts/test-installs.sh
